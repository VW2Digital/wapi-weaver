# Coturn standalone overlay. Used with docker-compose.production.yml:
#   docker compose -f docker-compose.production.yml -f docker-compose.turn.yml up -d coturn
#
# Credentials live in coturn/turnserver.conf (generated by install.sh, not in git).

services:
  coturn:
    image: coturn/coturn:4.6.2-r13
    container_name: wapi_weaver_coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
